apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: apps
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s

    scrape_configs:
      - job_name: 'conexao-solidaria-api'
        static_configs:
          - targets: ['metrics:9102']
      - job_name: 'conexao-solidaria-worker'
        static_configs:
          - targets: ['conexao-solidaria-worker:9102']