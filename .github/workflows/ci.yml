name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build-and-test:
    name: Build, Test and Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Conexao_Solidaria_REPO  

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore ConexaoSolidaria.slnx

    - name: Build project
      run: dotnet build ConexaoSolidaria.slnx --no-restore --configuration Release

    - name: Run unit tests
      run: dotnet test ConexaoSolidaria.slnx --no-build --configuration Release

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/conexao-solidaria-api
        tags: |
          type=sha
          type=raw,value=latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./Conexao_Solidaria_REPO
        file: ./Conexao_Solidaria_REPO/Docker/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
